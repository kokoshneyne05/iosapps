<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA Установщик</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0; }
    .refresh { background: #2c2c2e; color: #0a84ff; border: none; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .card { background: #1c1c1e; border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .icon { width: 54px; height: 54px; border-radius: 13px; background: #2c2c2e; flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #8e8e93; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: #8e8e93; font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .install-btn { background: #0a84ff; color: #fff; border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .install-btn:active { opacity: 0.7; }
    .status { color: #8e8e93; background: #1c1c1e; padding: 16px; border-radius: 14px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Мои IPA</h1>
    <button class="refresh" onclick="loadApps()">Обновить</button>
  </div>
  <div id="list" class="status">Загрузка релизов...</div>

  <script>
    let currentApps = [];

    function installApp(index) {
      const app = currentApps[index];
      if (!app) return;
      const fullIconUrl = app.icon ? `${window.location.origin}${app.icon}` : '';
      const iconParam = fullIconUrl ? `&icon=${encodeURIComponent(fullIconUrl)}` : '';
      const manifestUrl = `${window.location.origin}/api/manifest?url=${encodeURIComponent(app.url)}&id=${encodeURIComponent(app.bundleId)}&title=${encodeURIComponent(app.title)}&ver=${encodeURIComponent(app.version)}${iconParam}`;
      window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestUrl)}`;
    }

    async function loadApps() {
      const listEl = document.getElementById('list');
      listEl.className = 'status';
      listEl.textContent = 'Загрузка релизов...';

      try {
        const res = await fetch('/api/apps?t=' + Date.now());
        const data = await res.json();

        if (data.error) {
          listEl.textContent = data.error;
          return;
        }

        currentApps = data;
        if (!currentApps.length) {
          listEl.textContent = 'В GitHub Releases пока нет загруженных .ipa файлов.';
          return;
        }

        listEl.className = '';
        listEl.innerHTML = currentApps.map((app, i) => {
          const fallbackLetter = (app.title || 'A')[0].toUpperCase();
          const iconHtml = app.icon
            ? `<img class="icon" src="${app.icon}" alt="" onerror="this.outerHTML='<div class=icon>${fallbackLetter}</div>'">`
            : `<div class="icon">${fallbackLetter}</div>`;

          return `
            <div class="card">
              ${iconHtml}
              <div class="info">
                <div class="name">${app.title} <span style="color:#8e8e93;font-weight:400;">v${app.version}</span></div>
                <div class="meta">${app.sizeMb} МБ • ${app.bundleId}</div>
              </div>
              <button class="install-btn" onclick="installApp(${i})">Установить</button>
            </div>
          `;
        }).join('');
      } catch (e) {
        listEl.textContent = 'Ошибка соединения с сервером.';
      }
    }

    loadApps();
  </script>
</body>
</html>
